name: TaaS Check Run

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # Run TaaS for PR updates, and abort related jobs when a PR is closed.
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Required for reading the TaaS bot comment on the PR.
permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  TAAS_API_BASE_URL: https://dev.api.qualcomm.com/devicecloud/v2/taas
  TAAS_CONFIG_PATH: .github/taas-config.json

# Keep runs for the same PR/ref in order so the close run can see submitted Job IDs.
concurrency:
  group: taas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Submit a TaaS job for manual runs, main pushes, and active PR changes.
  submit-taas:
    name: Submit TaaS job

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed'
      )

    runs-on: ubuntu-latest

    steps:
      # Fetch the repository so the TaaS config file is available.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the request and submit the TaaS job.
      - name: Submit TaaS job
        shell: bash
        env:
          QCOM_QDC_API_KEY: ${{ secrets.QCOM_QDC_API_KEY }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          # The TaaS API key is required for both submit and abort calls.
          if [ -z "${QCOM_QDC_API_KEY}" ]; then
            echo "Missing required secret: QCOM_QDC_API_KEY" >&2
            exit 1
          fi

          # The request body starts from the repo config file.
          if [ ! -f "${TAAS_CONFIG_PATH}" ]; then
            echo "TaaS config file not found at ${TAAS_CONFIG_PATH}" >&2
            exit 1
          fi

          # Add GitHub callback metadata so TaaS can report results back to this repo.
          REQUEST_BODY="$(
            jq -n \
              --slurpfile config "${TAAS_CONFIG_PATH}" \
              --arg owner "${REPO_OWNER}" \
              --arg repo "${REPO_NAME}" \
              --arg sha "${HEAD_SHA}" \
              --arg branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
              --arg prNumber "${PR_NUMBER}" \
              '$config[0] + {
                callback: {
                  owner: $owner,
                  repo: $repo,
                  sha: $sha,
                  prNumber: (
                    if $prNumber != ""
                    then ($prNumber | tonumber)
                    else null
                    end
                  )
                },
                metadata: {
                  branch: $branch,
                  triggeredBy: "github-actions"
                }
              }'
          )"

          echo "Submitting TaaS job..."

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            "${TAAS_API_BASE_URL}/jobs" \
            --header "Authorization: ${QCOM_QDC_API_KEY}" \
            --header "X-QCOM-TokenType: apikey" \
            --header "X-QCOM-AppName: aihub" \
            --header "X-QCOM-TracingId: ${GITHUB_RUN_ID}" \
            --header "X-QCOM-ClientType: github-actions" \
            --header "Content-Type: application/json" \
            --data "${REQUEST_BODY}"

  # Abort TaaS jobs when a PR is closed without being merged.
  abort-taas:
    name: Abort TaaS jobs

    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == false

    runs-on: ubuntu-latest

    steps:
      # Read the latest Job ID from the comment created by the TaaS bot.
      - name: Find and abort TaaS job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QCOM_QDC_API_KEY: ${{ secrets.QCOM_QDC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Abort also needs the TaaS API key.
          if [ -z "${QCOM_QDC_API_KEY}" ]; then
            echo "Missing required secret: QCOM_QDC_API_KEY" >&2
            exit 1
          fi

          echo "Finding the latest TaaS Job ID for PR #${PR_NUMBER}..."

          # Example bot comment: "TaaS Job #184 submitted".
          JOB_ID="$(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[].body' \
            | grep -oE 'TaaS Job #[0-9]+ submitted' \
            | tail -n 1 \
            | grep -oE '[0-9]+' \
            || true
          )"

          if [ -z "${JOB_ID}" ]; then
            echo "No TaaS Job ID was found for PR #${PR_NUMBER}."
            exit 0
          fi

          echo "Aborting TaaS Job #${JOB_ID}..."

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            "${TAAS_API_BASE_URL}/jobs/${JOB_ID}/abort" \
            --header "Authorization: ${QCOM_QDC_API_KEY}" \
            --header "X-QCOM-TokenType: apikey" \
            --header "X-QCOM-AppName: aihub" \
            --header "X-QCOM-TracingId: ${GITHUB_RUN_ID}-${JOB_ID}" \
            --header "X-QCOM-ClientType: github-actions"

          echo "TaaS Job #${JOB_ID} aborted."
