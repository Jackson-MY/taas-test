name: TaaS Check Run

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  submit-taas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Submit TaaS job with GitHub check run callback
        shell: bash
        env:
          TAAS_CONFIG_PATH: .github/taas-config.json
          QCOM_API_KEY: ${{ secrets.QCOM_API_KEY }}
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          if [ -z "${QCOM_API_KEY}" ] || [ -z "${GH_APP_CLIENT_ID}" ] || [ -z "${GH_APP_INSTALLATION_ID}" ] || [ -z "${GH_APP_PRIVATE_KEY}" ]; then
            echo "Missing required secrets: QCOM_API_KEY, GH_APP_CLIENT_ID, GH_APP_INSTALLATION_ID, GH_APP_PRIVATE_KEY" >&2
            exit 1
          fi

          if [ ! -f "${TAAS_CONFIG_PATH}" ]; then
            echo "TaaS config file not found at ${TAAS_CONFIG_PATH}" >&2
            exit 1
          fi

          JWT="$(node - <<'NODE'
          const crypto = require('crypto');

          const clientId = process.env.GH_APP_CLIENT_ID;
          const privateKey = process.env.GH_APP_PRIVATE_KEY
            .trim()
            .replace(/^"|"$/g, '')
            .replace(/\\n/g, '\n');
          const now = Math.floor(Date.now() / 1000);

          const header = Buffer.from(JSON.stringify({ alg: 'RS256', typ: 'JWT' })).toString('base64url');
          const payload = Buffer.from(JSON.stringify({ iat: now - 60, exp: now + 540, iss: clientId })).toString('base64url');
          const signing = `${header}.${payload}`;
          const sign = crypto.createSign('RSA-SHA256');
          sign.update(signing);
          const sig = sign.sign(privateKey, 'base64url');

          console.log(`${signing}.${sig}`);
          NODE
          )"

          APP_TOKEN="$(
            curl -sS -X POST "https://api.github.com/app/installations/${GH_APP_INSTALLATION_ID}/access_tokens" \
              -H "Authorization: Bearer ${JWT}" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "User-Agent: taas-github-actions" \
              | node -e "let d=''; process.stdin.on('data', c => d += c).on('end', () => { const j = JSON.parse(d); if (!j.token) { console.error(d); process.exit(1); } console.log(j.token); })"
          )"
          echo "::add-mask::${APP_TOKEN}"

          echo "===== DEBUG: GitHub App identity (GET /app) ====="
          curl -sS -o /tmp/app.json -w "HTTP %{http_code}\n" \
            "https://api.github.com/app" \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: taas-github-actions"
          echo "--- /app: id/slug/owner/permissions/events ---"
          jq '{id, slug, name, owner: .owner.login, permissions, events}' /tmp/app.json || cat /tmp/app.json
          echo

          echo "===== DEBUG: Installation info (GET /app/installations/${GH_APP_INSTALLATION_ID}) ====="
          curl -sS -o /tmp/installation.json -w "HTTP %{http_code}\n" \
            "https://api.github.com/app/installations/${GH_APP_INSTALLATION_ID}" \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: taas-github-actions"
          echo "--- installation: account/target_type/repository_selection/permissions/events/suspended_at ---"
          jq '{id, account: .account.login, target_type, repository_selection, permissions, events, suspended_at}' /tmp/installation.json || cat /tmp/installation.json
          echo

          echo "===== DEBUG: Installation access token metadata ====="
          curl -sS -o /tmp/tokenmeta.json -w "HTTP %{http_code}\n" \
            -X POST "https://api.github.com/app/installations/${GH_APP_INSTALLATION_ID}/access_tokens" \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: taas-github-actions"
          echo "--- token metadata: expires_at/permissions/repository_selection/repositories (token itself masked) ---"
          jq '{expires_at, permissions, repository_selection, repositories: [.repositories[]?.full_name]}' /tmp/tokenmeta.json || cat /tmp/tokenmeta.json
          echo

          echo "===== DEBUG: Repos visible to this installation ====="
          curl -sS -o /tmp/repos.json -w "HTTP %{http_code}\n" \
            "https://api.github.com/installation/repositories?per_page=100" \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: taas-github-actions"
          jq '{total_count, repository_selection, repositories: [.repositories[]?.full_name]}' /tmp/repos.json || cat /tmp/repos.json
          echo

          echo "===== DEBUG: Target repo lookup with installation token ====="
          echo "Target: ${REPO_OWNER}/${REPO_NAME}  head_sha=${HEAD_SHA}"
          curl -sS -o /tmp/repo.json -w "HTTP %{http_code}\n" \
            "https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}" \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: taas-github-actions"
          jq '{full_name, private, permissions}' /tmp/repo.json || cat /tmp/repo.json
          echo

          echo "===== Creating check-run ====="
          CHECK_HTTP_CODE="$(
            curl -sS -o /tmp/checkrun.json -w "%{http_code}" \
              -X POST "https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/check-runs" \
              -H "Authorization: Bearer ${APP_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -H "User-Agent: taas-github-actions" \
              -d "{\"name\": \"TaaS Test\", \"head_sha\": \"${HEAD_SHA}\", \"status\": \"queued\"}"
          )"
          echo "check-runs HTTP ${CHECK_HTTP_CODE}"
          cat /tmp/checkrun.json
          echo
          if [ "${CHECK_HTTP_CODE}" != "201" ]; then
            echo "check-run creation failed" >&2
            exit 1
          fi
          CHECK_RUN_ID="$(jq -r '.id' /tmp/checkrun.json)"
          echo "CHECK_RUN_ID=${CHECK_RUN_ID}"

          REQUEST_BODY="$(
            jq -n \
              --slurpfile config "${TAAS_CONFIG_PATH}" \
              --arg token "${APP_TOKEN}" \
              --arg owner "${REPO_OWNER}" \
              --arg repo "${REPO_NAME}" \
              --arg sha "${HEAD_SHA}" \
              --argjson checkRunId "${CHECK_RUN_ID}" \
              --arg branch "${GITHUB_REF_NAME}" \
              --arg prNumber "${PR_NUMBER}" \
              '$config[0] + {
                callback: {
                  token: $token,
                  owner: $owner,
                  repo: $repo,
                  sha: $sha,
                  checkRunId: $checkRunId,
                  prNumber: (
                    if $prNumber != ""
                    then ($prNumber | tonumber)
                    else null
                    end
                  )
                },
                metadata: {
                  branch: $branch,
                  triggeredBy: "github-actions"
                }
              }'
          )"

          curl --location 'https://dev.api.qualcomm.com/devicecloud/v2/taas/jobs' \
            --header "Authorization: ${QCOM_API_KEY}" \
            --header 'X-QCOM-TokenType: apikey' \
            --header 'X-QCOM-AppName: aihub' \
            --header "X-QCOM-TracingId: ${GITHUB_RUN_ID}" \
            --header 'X-QCOM-ClientType: github-actions' \
            --header 'Content-Type: application/json' \
            --data "${REQUEST_BODY}"
