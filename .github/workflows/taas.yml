name: TaaS Check Run

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  submit-taas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Submit TaaS job with GitHub check run callback
        shell: bash
        env:
          TAAS_CONFIG_PATH: .github/taas-config.json
          QCOM_QDC_API_KEY: ${{ secrets.QCOM_QDC_API_KEY }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          if [ -z "${QCOM_QDC_API_KEY}" ]; then
            echo "Missing required secret: QCOM_QDC_API_KEY" >&2
            exit 1
          fi

          if [ ! -f "${TAAS_CONFIG_PATH}" ]; then
            echo "TaaS config file not found at ${TAAS_CONFIG_PATH}" >&2
            exit 1
          fi

          REQUEST_BODY="$(
            jq -n \
              --slurpfile config "${TAAS_CONFIG_PATH}" \
              --arg owner "${REPO_OWNER}" \
              --arg repo "${REPO_NAME}" \
              --arg sha "${HEAD_SHA}" \
              --arg branch "${GITHUB_REF_NAME}" \
              --arg prNumber "${PR_NUMBER}" \
              '$config[0] + {
                callback: {
                  owner: $owner,
                  repo: $repo,
                  sha: $sha,
                  prNumber: (
                    if $prNumber != ""
                    then ($prNumber | tonumber)
                    else null
                    end
                  )
                },
                metadata: {
                  branch: $branch,
                  triggeredBy: "github-actions"
                }
              }'
          )"

          curl --location 'https://dev.api.qualcomm.com/devicecloud/v2/taas/jobs' \
            --header "Authorization: ${QCOM_QDC_API_KEY}" \
            --header 'X-QCOM-TokenType: apikey' \
            --header 'X-QCOM-AppName: aihub' \
            --header "X-QCOM-TracingId: ${GITHUB_RUN_ID}" \
            --header 'X-QCOM-ClientType: github-actions' \
            --header 'Content-Type: application/json' \
            --data "${REQUEST_BODY}"
